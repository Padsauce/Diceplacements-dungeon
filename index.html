<title>Diceplacement 3D</title>

<style>
/* Branche « Papier » : règles du livret, mise en page de livre-jeu illustré à l'encre.
   Un seul thème (page imprimée) : toutes les couleurs sont explicites. */
:root {
  --paper: #efe5cf;
  --paper-2: #e6d9bc;
  --paper-3: #d8c8a4;
  --ink: #1b1714;
  --ink-2: #3d352d;
  --ink-soft: #6c6152;
  --red: #8e1f1a;
  --blue: #23415f;
  --violet: #4f3570;
  --font-title: "IM Fell English SC", "Iowan Old Style", Georgia, serif;
  --font-fell: "IM Fell English", "Iowan Old Style", Georgia, serif;
  --font-body: "EB Garamond", Garamond, Georgia, serif;
  --grain: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .33  0 0 0 0 .25  0 0 0 0 .14  0 0 0 .11 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  color-scheme: light;
}
html, body { height: 100%; }
body { background: #2b241c; color: var(--ink); font-family: var(--font-body); font-size: 16px; overflow: hidden; -webkit-tap-highlight-color: transparent; user-select: none; }
#app {
  height: 100%; display: flex; flex-direction: column; max-width: 560px; margin-inline: auto;
  background-color: var(--paper);
  background-image: var(--grain), radial-gradient(ellipse at 50% 45%, rgba(255,250,235,0) 55%, rgba(120,90,40,.22) 100%);
  box-shadow: 0 0 40px rgba(0,0,0,.5);
}

/* Feuille d'aventure (haut) */
#hud {
  display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; align-items: center;
  padding-block: max(8px, env(safe-area-inset-top, 0px)) 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 3px double var(--ink);
}
.floor-label { font: 25px/1 var(--font-title); letter-spacing: .02em; }
.hud-right { display: flex; gap: 10px; align-items: center; }
.tombs { font: 600 21px/1 var(--font-body); font-variant-numeric: lining-nums; color: var(--ink-2); }
.sheet { grid-column: 1 / -1; border: 3px double var(--ink); padding: 4px 8px 5px; display: grid; grid-template-columns: 26px repeat(3, minmax(0, 1fr)) minmax(0, 1.3fr); gap: 0 6px; font-variant-numeric: lining-nums tabular-nums; }
.sheet span { font: 500 19px/1.15 var(--font-body); }
.sheet .h { font: 12px/1.3 var(--font-title); letter-spacing: .06em; color: var(--ink-soft); }
.sheet .k { font: 18px/1.15 var(--font-title); }
.sheet .minus { color: var(--red); }
.sheet .tot { font-weight: 700; font-size: 20px; }
.sheet .tot.bad { color: var(--red); }
.effects { grid-column: 1 / -1; display: flex; gap: 6px; flex-wrap: wrap; }
.effects:empty { display: none; }
.tag { font: italic 14px var(--font-fell); padding: 0 6px; border: 1px solid var(--ink); }

/* Carte */
#stage { position: relative; flex: 1; min-height: 0; }
#view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: manipulation; }
#automap { position: absolute; right: 10px; bottom: 10px; z-index: 3; border: 1px solid #2d4e9c; box-shadow: 2px 2px 0 rgba(45,78,156,.35); pointer-events: none; }
#viewBtn { position: absolute; left: 10px; bottom: 10px; z-index: 3; }
.gl-err { position: absolute; inset: 30% 16px auto; z-index: 4; text-align: center; font: italic 19px var(--font-fell); background: var(--paper); border: 3px double var(--ink); padding: 12px; }
#banner {
  position: absolute; left: 50%; top: 10px; transform: translateX(-50%); z-index: 5;
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center;
  max-width: calc(100% - 32px); padding: 8px 14px;
  background-color: var(--paper); background-image: var(--grain);
  border: 3px double var(--ink); font: 21px/1.15 var(--font-fell);
}
#banner[hidden] { display: none; }
.bn-btns { display: flex; gap: 6px; flex-wrap: wrap; }
.bn-btns:empty { display: none; }
.die-svg { display: block; }

/* Commandes (bas) */
#controls {
  display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; align-items: center;
  padding-block: 10px calc(10px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-top: 3px double var(--ink);
}
.left { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
#items { display: flex; gap: 6px; flex-wrap: wrap; }
#items:empty { display: none; }
#hint { font: italic 19px/1.2 var(--font-fell); color: var(--ink-2); text-wrap: balance; min-height: 23px; }
#hint b.r { font: italic 700 19px/1.2 var(--font-body); color: var(--red); }

button {
  font: 600 16px var(--font-body); color: var(--ink); background: var(--paper);
  border: 3px double var(--ink); border-radius: 0; padding: 6px 12px; cursor: pointer;
}
button:hover:not(:disabled) { background: var(--paper-2); }
button:active:not(:disabled) { transform: translateY(1px); }
button:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
button:disabled { opacity: .38; cursor: default; }
button.primary { background: var(--ink); color: var(--paper); border-color: var(--paper); outline: 2px solid var(--ink); outline-offset: -1px; }
button.primary:hover:not(:disabled) { background: var(--ink-2); }
button.primary:focus-visible { outline: 2px solid var(--red); }
button.violet { border-color: var(--violet); color: var(--violet); }
button.danger { border-color: var(--red); color: var(--red); }
button.small { font-size: 14px; padding: 3px 8px; }

.roll-wrap { display: flex; flex-direction: column; align-items: center; gap: 2px; }
#rollBtn { width: 76px; height: 76px; padding: 0; border: 0; background: none; display: grid; place-items: center; }
#rollBtn:hover:not(:disabled) { background: none; }
#rollBtn.ready { animation: pulse 1.4s ease-in-out infinite; }
#rollBtn:disabled { opacity: 1; }
#rollBtn.rolling, .bn-die.rolling { animation: wobble .12s linear infinite; }
.roll-cap { font: italic 17px/1 var(--font-fell); color: var(--ink-2); white-space: nowrap; }
.roll-cap.o { color: var(--blue); } .roll-cap.d { color: var(--red); }
@keyframes pulse { 50% { transform: scale(1.06) rotate(-3deg); } }
@keyframes wobble { 0% { transform: rotate(-10deg); } 50% { transform: rotate(10deg); } 100% { transform: rotate(-10deg); } }

/* Fenêtres et écrans */
.overlay {
  position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; background: rgba(27, 20, 12, .62);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-bottom, 0px));
}
.overlay[hidden] { display: none; }
.card {
  width: min(460px, 100%); max-height: 100%; overflow: auto;
  background-color: var(--paper); background-image: var(--grain);
  border: 3px double var(--ink); outline: 1px solid var(--ink); outline-offset: -8px;
  padding: 20px; display: flex; flex-direction: column; gap: 12px;
}
.card h2 { margin: 0; font: 31px/1.05 var(--font-title); text-wrap: balance; text-align: center; }
.card h2::after { content: "❦"; display: block; font: 18px/1.4 var(--font-fell); color: var(--red); }
.card p { margin: 0; line-height: 1.45; }
.card .muted { color: var(--ink-soft); font-size: 15px; font-style: italic; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.btns.col { flex-direction: column; align-items: stretch; }
/* La dernière rangée de boutons d'un écran reste visible en bas de la fenêtre */
.card > .btns:last-child, .card > form > .btns:last-child {
  position: sticky; bottom: -20px; z-index: 2; margin: 0 -15px -20px; padding: 10px 15px 20px;
  background: linear-gradient(var(--ink), var(--ink)) left 0 bottom 5px / 100% 1px no-repeat, var(--paper);
  border-top: 1px solid var(--paper-3);
}
.card > .btns.col:last-child { position: static; margin: 0; padding: 0; background: none; border: 0; }
.btns.col button { font-size: 18px; padding: 8px 12px; }
.list { display: flex; flex-direction: column; gap: 4px; }
.li { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; border-bottom: 1px solid var(--paper-3); padding: 6px 2px; }
.li b { font-weight: 600; }
.li small { display: block; font: italic 15px/1.3 var(--font-fell); color: var(--ink-soft); }
.li.owned b::after { content: " ✓"; color: var(--red); }
.li.active { background: rgba(142, 31, 26, .07); }
.li .acts { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
.sum { font: 20px/1.4 var(--font-body); border: 1px solid var(--ink); padding: 6px 12px; font-variant-numeric: lining-nums; }
.sum .bad { color: var(--red); font-weight: 700; }
.bigtitle { font: 44px/1 var(--font-title); text-align: center; letter-spacing: .01em; }
.subtitle { text-align: center; font: italic 17px var(--font-fell); color: var(--ink-2); }
.hello { text-align: center; font: italic 20px var(--font-fell); }
button.hello { display: flex; align-items: center; justify-content: center; gap: 2px; margin: 4px auto 2px; padding: 6px 14px 6px 8px; background: transparent; border: 1px dotted currentColor; border-radius: 999px; box-shadow: none; color: inherit; min-height: 0; }
button.hello:hover, button.hello:focus-visible { border-style: solid; }
button.hello .chev { font-size: 14px; margin-left: 6px; opacity: .7; }
.pcard { text-align: center; }
.pcard .pname { font: 26px var(--font-fell); margin: 6px 0 2px; }
.kv { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; margin: 10px 0; text-align: left; }
.kv div { display: flex; justify-content: space-between; border-bottom: 1px dotted currentColor; padding: 2px 0; gap: 8px; }
.kv b { font-weight: 600; }
.rules { margin: 0; padding: 0 0 0 20px; line-height: 1.45; }
.rules li { margin-bottom: 4px; }
.section-h { font: 15px var(--font-title); letter-spacing: .1em; color: var(--ink-soft); border-bottom: 1px solid var(--ink); }
.cover { display: block; width: 100%; height: auto; }
.gem { display: block; margin: 0 auto; width: 150px; height: 128px; }
label.field { display: flex; flex-direction: column; gap: 6px; font: italic 17px var(--font-fell); }
input[type=text] { font: 500 20px var(--font-body); padding: 6px 10px; border: 0; border-bottom: 2px solid var(--ink); background: rgba(255,250,235,.6); color: var(--ink); border-radius: 0; }
input[type=text]:focus { outline: 2px solid var(--red); outline-offset: 2px; }
.err { color: var(--red); font-style: italic; min-height: 1.2em; }
.lb-wrap { overflow-x: auto; }
table.lb { width: 100%; border-collapse: collapse; font-variant-numeric: lining-nums tabular-nums; font-size: 15px; }
table.lb th { font: 12px/1.2 var(--font-title); letter-spacing: .04em; text-align: right; padding: 4px; border-bottom: 2px solid var(--ink); vertical-align: bottom; }
table.lb th:first-child, table.lb td:first-child { text-align: left; }
table.lb th button { all: unset; cursor: pointer; }
table.lb th button:focus-visible { outline: 2px solid var(--red); }
table.lb th.sorted { color: var(--red); }
table.lb td { padding: 6px 4px; text-align: right; border-bottom: 1px solid var(--paper-3); white-space: nowrap; }
table.lb td small { display: block; font-size: 12px; color: var(--ink-soft); }
table.lb tr.me td { background: rgba(142, 31, 26, .08); font-weight: 600; }
.rank { font-family: var(--font-title); color: var(--ink-soft); margin-right: 4px; }
.av { display: inline-grid; place-items: center; width: 30px; height: 30px; flex: none; border: 1.5px solid var(--ink); border-radius: 50%; background: var(--paper-2); font-size: 17px; line-height: 1; filter: grayscale(1) sepia(.3) contrast(1.15); vertical-align: middle; }
.av.lg { width: 42px; height: 42px; font-size: 24px; }
.hello .av { margin-right: 8px; }
.center { text-align: center; }
.plist { display: flex; flex-direction: column; max-height: 36vh; overflow: auto; border: 1px solid var(--ink); padding: 2px 8px; }

.pl:last-child { border-bottom: 0; }

.tabs { display: flex; gap: 6px; justify-content: center; }
.tabs button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
table.lb td .av { width: 24px; height: 24px; font-size: 13px; margin-right: 6px; }
#toast { position: fixed; left: 50%; top: max(12px, env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 40; max-width: calc(100% - 32px);

.mode h3 { margin: 0; font: 22px/1.1 var(--font-title); }
.mode p { margin: 0; font-size: 15.5px; line-height: 1.4; }
.mode .best { font: italic 15px var(--font-fell); color: var(--ink-soft); }
.mode .btns { justify-content: flex-start; }
.score-big { text-align: center; font: 700 46px/1 var(--font-body); font-variant-numeric: lining-nums; }
.score-big small { display: block; font: 13px var(--font-title); letter-spacing: .12em; color: var(--ink-soft); }
.trophy { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; border-bottom: 1px solid var(--paper-3); padding: 7px 2px; }
.trophy .ico { font-size: 24px; text-align: center; filter: grayscale(1) sepia(.3); }
.trophy.locked { opacity: .5; }
.trophy b { display: block; font-weight: 600; }
.trophy small { display: block; font: italic 14.5px/1.3 var(--font-fell); color: var(--ink-soft); }
.trophy .when { font: italic 13px var(--font-fell); color: var(--ink-soft); white-space: nowrap; }
.prog { height: 5px; border: 1px solid var(--ink); margin-top: 4px; }
.prog i { display: block; height: 100%; background: var(--ink); }
@media (prefers-reduced-motion: reduce) { #rollBtn.ready, #rollBtn.rolling, .bn-die.rolling { animation: none; } }

  $("avPick").querySelectorAll("button").forEach(b => b.addEventListener("click", () => {
    pickAv = +b.dataset.av; $("avPick").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  }));
}
let nameBack = null;
function nameScreen(editing, back = profilesScreen) {
  nameBack = back;
  const first = !store.profiles.length;
  current = editing ? "edit" : "name"; pickAv = editing ? editing.avatar | 0 : 0;
  screen(`<h2>${editing ? "Modifier le profil" : first ? "Qui es-tu, aventurier ?" : "Nouveau profil"}</h2>
    ${first ? `<p>Ton nom sera inscrit sur ta feuille d'aventure et au classement de cet appareil.</p>` : ""}
    <form id="nForm"><label class="field">Ton prénom<input type="text" id="nInput" maxlength="16" autocomplete="off" value="${editing ? esc(editing.name) : ""}"></label>
    <div class="section-h">Ton avatar</div><div class="avpick" id="avPick">${avPickHTML()}</div>
    <p class="err" id="nErr"></p>
    <div class="btns">${first ? "" : `<button type="button" id="nBack">Retour</button>`}<button type="submit" class="primary">${editing ? "Enregistrer" : first ? "Entrer dans le donjon" : "Créer le profil"}</button></div></form>`);
  wireAvPick();
  $("nInput").focus();
  if (!first) $("nBack").addEventListener("click", () => nameBack());
  $("nForm").addEventListener("submit", e => {
    e.preventDefault();
    const err = validName($("nInput").value, editing && editing.id);
    if (err) { $("nErr").textContent = err; return; }
    if (editing) { editing.name = $("nInput").value.trim(); editing.avatar = pickAv; saveStore(); nameBack(); }
    else { createProfile($("nInput").value, pickAv); homeScreen(); }
  });
}
function meScreen() {
  current = "me";
  const p = profile(); if (!p) return homeScreen();
  const st = p.stats, nT = Object.keys(p.trophies || {}).length;
  const kv = (k, v) => `<div><span>${k}</span><b>${v}</b></div>`;
  screen(`<div class="pcard">${avHTML(p.avatar, "lg")}<div class="pname">${esc(p.name)}</div>
      <p class="muted">${store.profiles.length > 1 ? `Un des ${store.profiles.length} profils de cet appareil.` : "Le seul profil de cet appareil."}</p></div>
    <div class="section-h">Records</div>
    <div class="kv">${MODE_IDS.map(m => kv(MODES[m].name, p.best[m] !== undefined ? p.best[m] + " pts" : "—")).join("")}${kv("Trophées", `${nT} / ${TROPHIES.length}`)}</div>
    <div class="section-h">Statistiques</div>
    <div class="kv">${kv("Étage max", st.floorMax ? toRoman(st.floorMax) : "—")}${kv("Or gagné", st.gold + " ¢")}${kv("Lancers", st.rolls)}${kv("Parties", st.games)}${kv("Donjons finis", st.wins)}${kv("Moins de tombes", st.tombsBest ?? "—")}</div>
    <div class="btns"><button id="meBack">Retour</button><button id="meEdit">Modifier</button><button class="primary" id="meSwitch">Changer de profil</button></div>`);
  $("meBack").addEventListener("click", homeScreen);
  $("meEdit").addEventListener("click", () => nameScreen(p, meScreen));
  $("meSwitch").addEventListener("click", profilesScreen);
}
function profilesScreen() {
  current = "profiles";
  screen(`<h2>Changer de profil</h2><div class="list" id="pList"></div>
    <div class="btns"><button id="pBack">Retour</button><button class="primary" id="pNew">Nouveau profil</button></div>`);
  const list = $("pList");
  for (const p of store.profiles) {
    const li = document.createElement("div"); li.className = "li" + (p.id === store.active ? " active" : "");
    li.innerHTML = `<div style="display:flex;gap:10px;align-items:center">${avHTML(p.avatar)}<div><b>${esc(p.name)}</b><small>${p.id === store.active ? "Profil actif · " : ""}étage max ${p.stats.floorMax ? toRoman(p.stats.floorMax) : "—"}, ${p.stats.wins} donjon${p.stats.wins > 1 ? "s" : ""} fini${p.stats.wins > 1 ? "s" : ""}${Object.keys(p.saves || {}).length ? ", une partie en cours" : ""}</small></div></div>`;
    const acts = document.createElement("div"); acts.className = "acts";
    const mk = (label, fn, cls = "", dis = false) => { const b = document.createElement("button"); b.className = "small " + cls; b.textContent = label; b.disabled = dis; b.addEventListener("click", fn); acts.appendChild(b); };
    if (p.id !== store.active) mk("Choisir", () => { store.active = p.id; saveStore(); homeScreen(); }, "primary");
    mk("Modifier", () => nameScreen(p));
    mk("Supprimer", () => {
      screen(`<h2>Supprimer ${esc(p.name)} ?</h2><p>Ses statistiques et sa partie en cours seront perdues.</p>
        <div class="btns"><button id="dNo">Annuler</button><button class="danger" id="dYes">Supprimer</button></div>`);
      $("dNo").addEventListener("click", profilesScreen);
      $("dYes").addEventListener("click", () => {
        store.profiles = store.profiles.filter(q => q.id !== p.id);
        if (store.active === p.id) store.active = store.profiles[0].id;
        saveStore(); profilesScreen();
      });
    }, "danger", store.profiles.length < 2);
    li.appendChild(acts); list.appendChild(li);
  }
  $("pBack").addEventListener("click", meScreen);
  $("pNew").addEventListener("click", () => nameScreen(null));
}
const BOARD_COLS = [
  { key: "name", label: "Joueur", dir: 1 },
  { key: "floorMax", label: "Étage max", dir: -1 },
  { key: "gold", label: "Or gagné", dir: -1 },
  { key: "rolls", label: "Lancers", dir: -1 },
  { key: "wins", label: "Donjons finis", dir: -1 },
  { key: "tombsBest", label: "Moins de tombes", dir: 1 },
];
let boardSort = null;
function boardScreen(tab = "quick", sortKey = boardSort) {
  current = "board"; boardSort = sortKey;
  const me = profile();
  const tabs = `<div class="tabs">${MODE_IDS.map(m => `<button class="small" data-t="${m}" aria-pressed="${tab === m}">${MODES[m].name}</button>`).join("")}<button class="small" data-t="profiles" aria-pressed="${tab === "profiles"}">Profils</button></div>`;
  let body;
  if (tab === "profiles") {
    const rows = store.profiles.map(p => ({ name: p.name, avatar: p.avatar | 0, stats: p.stats, me: !!me && p.id === me.id }));
    const val = (r, k) => k === "name" ? lower(r.name) : r.stats[k];
    rows.sort((a, b) => {
      if (!sortKey) return (b.stats.floorMax - a.stats.floorMax) || (b.stats.gold - a.stats.gold);
      const col = BOARD_COLS.find(c => c.key === sortKey), va = val(a, sortKey), vb = val(b, sortKey);
      if (va === null && vb === null) return 0; if (va === null) return 1; if (vb === null) return -1;
      return (va < vb ? -1 : va > vb ? 1 : 0) * col.dir;
    });
    body = `<div class="lb-wrap"><table class="lb"><thead><tr>${BOARD_COLS.map(c => `<th class="${sortKey === c.key ? "sorted" : ""}"><button data-k="${c.key}">${c.label}</button></th>`).join("")}</tr></thead>
      <tbody>${rows.map((r, i) => `<tr class="${r.me ? "me" : ""}"><td><span class="rank">${toRoman(i + 1)}.</span>${avHTML(r.avatar)}${esc(r.name)}</td>
        <td>${toRoman(r.stats.floorMax)}</td><td>${r.stats.gold}<small>record ${r.stats.goldBest}</small></td><td>${r.stats.rolls}</td>
        <td>${r.stats.wins}<small>${r.stats.games} partie${r.stats.games > 1 ? "s" : ""}</small></td><td>${r.stats.tombsBest === null ? "—" : r.stats.tombsBest}</td></tr>`).join("")}</tbody></table></div>
      <p class="muted">Statistiques cumulées des profils de cet appareil. Touche un en-tête pour trier.</p>`;
  } else {
    const runs = store.runs.filter(r => r.mode === tab).sort((a, b) => b.score - a.score || a.date - b.date).slice(0, 30);
    const detail = r => tab === "normal" ? `${r.completed ? "fini" : "étage " + toRoman(r.floors)} · ${r.coins} ¢ · ${r.hp} PV · ✝ ${r.tombs}` : tab === "quick" ? `${r.completed ? "fini" : "étage " + toRoman(r.floors + 1)} · ${r.hp} PV · ${r.coins} ¢` : `${r.floors} étage${r.floors > 1 ? "s" : ""} · ${r.coins} ¢`;
    const fmt = t => new Date(t).toLocaleDateString("fr-FR", { day: "numeric", month: "short" });
    body = runs.length ? `<div class="lb-wrap"><table class="lb"><thead><tr><th>Joueur</th><th>Score</th><th>Date</th></tr></thead><tbody>${runs.map((r, i) => `<tr class="${me && r.pid === me.id ? "me" : ""}">
      <td><span class="rank">${toRoman(i + 1)}.</span>${avHTML(r.avatar)}${esc(r.name)}<small>${detail(r)}${r.items ? ` · objets +${r.items}` : ""}</small></td><td><b>${r.score}</b></td><td>${fmt(r.date)}</td></tr>`).join("")}</tbody></table></div>`
      : `<p class="muted center">Aucune partie terminée dans ce mode pour l'instant.</p>`;
    body += `<p class="muted">${esc(MODES[tab].desc)}</p>`;
  }
  screen(`<h2>Le classement</h2>${tabs}${body}<div class="btns"><button class="primary" id="bBack">Retour</button></div>`);
  $("modalCard").querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => boardScreen(b.dataset.t, null)));
  $("modalCard").querySelectorAll("th button").forEach(b => b.addEventListener("click", () => boardScreen("profiles", b.dataset.k)));
  $("bBack").addEventListener("click", () => { boardSort = null; homeScreen(); });
}
function rulesScreen() {
  current = "rules";
  screen(`<h2>Les règles du livret</h2>
    <ul class="rules">
      <li>Lance le dé : <b>impair</b>, tu pars en diagonale ; <b>pair</b>, en ligne droite. Tu avances du résultat, sans changer de direction.</li>
      <li>Contre un mur, tu rebondis. Demi-tour seulement s'il n'y a pas d'autre chemin, même par rapport au tour d'avant.</li>
      <li>Tout ce que tu traverses s'applique : pièces, coffres, monstres, cœurs, toiles (qui t'arrêtent), clés, téléportails. Seul l'escalier est facultatif : traverse-le, ou finis ton tour dessus ou à côté.</li>
      <li>Les PV et les pièces se comptent à la sortie de l'étage. Sous 1 PV, c'est une tombe, et tu repars avec 10 PV et 0 ¢.</li>
      <li>Trois modes : la <b>partie rapide</b> (5 étages, plus de PV = fin), le mode <b>normal</b> (50 étages jusqu'à la Salle du Trésor, une mort ajoute une tombe) et le mode <b>sans fin</b>. Les objets non utilisés rapportent des points en fin de partie.</li>
    </ul>
    <div class="btns"><button class="primary" id="rBack">Retour</button></div>`);
  $("rBack").addEventListener("click", homeScreen);
}

// ============================================================
//  Entrées
// ============================================================
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), hitP = new THREE.Vector3();
const planeGround = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), planeWall = new THREE.Plane(new THREE.Vector3(0, 1, 0), -WALL_H);
function cellAt(e) {
  const r = view.getBoundingClientRect();
  ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  if (ray.ray.intersectPlane(planeWall, hitP)) { const x = Math.floor(hitP.x), y = Math.floor(hitP.z); if (x >= 0 && y >= 0 && x < G.W && y < G.H && isWall(x, y)) return [x, y]; }
  if (ray.ray.intersectPlane(planeGround, hitP)) return [Math.floor(hitP.x), Math.floor(hitP.z)];
  return [-1, -1];
}
view.addEventListener("pointerdown", e => {
  if (!G.map || G.phase !== "play") return;
  const [tx, ty] = cellAt(e);
  if (G.teleMode) { if (teleTarget(tx, ty)) teleportTo(tx, ty); return; }
  if (!G.pick) return;
  const h = G.hero, hit = list => list.some(([x, y]) => x === tx && y === ty);
  const o = G.pick.options.find(o => h.x + o.dir[0] === tx && h.y + o.dir[1] === ty)
    || G.pick.options.find(o => !o.wall && hit(o.preview.ends))
    || G.pick.options.find(o => !o.wall && hit(o.preview.tiles));
  if (o) G.pick.resolve({ dir: o.dir, wall: !!o.wall });
});
$("rollBtn").addEventListener("click", () => playTurn());
$("menuBtn").addEventListener("click", async () => {
  if (G.busy || G.phase !== "play") return;
  const ok = await modal(`<h2>Retour au menu ?</h2><p>Ta partie est sauvegardée au début de l'étage ${toRoman((G.fi) + 1)}. En revenant, tu reprendras cet étage depuis le départ.</p>`,
    [{ label: "Continuer à jouer", value: false }, { label: "Menu", value: true, cls: "primary" }]);
  if (ok) homeScreen();
});
window.addEventListener("keydown", e => {
  if (!$("modal").hidden || G.phase !== "play") return;
  if ((e.key === " " || e.key === "Enter") && !G.busy) { e.preventDefault(); playTurn(); return; }
  const map = { ArrowUp: [0, -1], ArrowRight: [1, 0], ArrowDown: [0, 1], ArrowLeft: [-1, 0], q: [-1, -1], e: [1, -1], z: [-1, 1], c: [1, 1] };
  const dir = map[e.key]; if (!dir || !G.pick) return;
  const o = G.pick.options.find(o => sameDir(o.dir, dir) && !o.wall) || G.pick.options.find(o => sameDir(o.dir, dir));
  if (o) { e.preventDefault(); G.pick.resolve({ dir: o.dir, wall: !!o.wall }); }
});

// ============================================================
//  Démarrage : l'étage I en décor derrière le menu
// ============================================================
G.stats = gameStats(); G.committed = gameStats();
G.map = FLOORS[0].split("\n").map(r => [...r]);
G.ledger = { hpIn: START_HP, hpPlus: 0, hpMinus: 0, cIn: 0, cPlus: 0, cMinus: 0 };
for (let y = 0; y < G.H; y++) for (let x = 0; x < G.W; x++) if (G.map[y][x] === "P") Object.assign(G.hero, { x, y, px: x, py: y });
requestAnimationFrame(loop);
homeScreen();
window.__dpp = G; window.__store = () => store; window.__test_loadFloor = loadFloor; // accès de test
</script>
